# Facilitate unit testing against different Pydantic versions for a provided package.

name: '🐍 Pydantic Version Testing'

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
        description: "From which folder this pipeline executes"
      python-version:
        required: false
        type: string
        description: "Python version to use"
        default: "3.11"
      pydantic-version:
        required: true
        type: string
        description: "Pydantic version to test."

permissions:
  contents: read

env:
  UV_FROZEN: "true"
  UV_NO_SYNC: "true"

jobs:
  build:
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: 'Pydantic ~=${{ inputs.pydantic-version }}'
    steps:
      - name: '📋 Checkout Code'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: '🐍 Set up Python ${{ inputs.python-version }} + UV'
        uses: "./.github/actions/uv_setup"
        with:
          python-version: ${{ inputs.python-version }}
          cache-suffix: test-pydantic-${{ inputs.working-directory }}
          working-directory: ${{ inputs.working-directory }}

      - name: '📦 Install Test Dependencies'
        shell: bash
        run: uv sync --group test

      - name: '🔄 Install Specific Pydantic Version'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.pydantic-version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Invalid pydantic version: $VERSION" >&2
            exit 1
          fi
          VIRTUAL_ENV=.venv uv pip install "pydantic~=$VERSION"

      - name: '🧪 Run Core Tests'
        shell: bash
        run: |
          make test

      - name: '🧹 Verify Clean Working Directory'
        shell: bash
        run: |
          set -eu

          STATUS="$(git status)"
          echo "$STATUS"

          # grep will exit non-zero if the target message isn't found,
          # and `set -e` above will cause the step to fail.
          echo "$STATUS" | grep 'nothing to commit, working tree clean'
